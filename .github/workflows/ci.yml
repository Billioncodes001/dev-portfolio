name: Portfolio Checks and Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_LOG_PATH: .wrangler/logs

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run audit:public
      - run: npm run test:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: express-browser-evidence-${{ github.sha }}
          path: |
            test-results/*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run test:e2e:worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-browser-evidence-${{ github.sha }}
          path: |
            test-results/*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "40687c1a299192a1ba3add80961e429f"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit:public
      - run: npm run deploy:cloudflare
