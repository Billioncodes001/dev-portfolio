<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Private contact review | Josiah Adeyemo</title>
    <link rel="stylesheet" href="/contact-review.css" />
    <script src="/contact-review.js" defer></script>
  </head>
  <body>
    <main>
      <a href="/">Back to portfolio</a>
      <h1>Private contact review</h1>
      <p>
        This page contains no messages until authorized. Your token stays in
        this page's memory only. Reloading or locking clears it. Use a trusted
        device.
      </p>
      <form id="login" autocomplete="off">
        <label for="token">Admin token</label>
        <input
          id="token"
          type="password"
          required
          minlength="32"
          maxlength="256"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit">Unlock inbox</button>
      </form>
      <nav aria-label="Inbox controls">
        <button id="previous" type="button" disabled>Previous</button>
        <button id="next" type="button" disabled>Next</button>
        <button id="lock" type="button" disabled>Lock and clear</button>
      </nav>
      <p id="status" role="status" aria-live="polite">Locked.</p>
      <section id="messages" aria-label="Contact messages"></section>
    </main>
  </body>
</html>
